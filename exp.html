<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>発話シグナル可視化 (exp)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      background: var(--bg); color: var(--fg); padding: 16px;
    }
    h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; margin-bottom: 12px;
    }
    .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 500; letter-spacing: .05em; text-transform: uppercase; }
    button {
      background: #21262d; color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 14px; cursor: pointer; font: inherit;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); }
    button.danger { background: var(--bad); color: #0d1117; border-color: var(--bad); }
    input[type=number] {
      background: #0d1117; color: var(--fg); border: 1px solid var(--border);
      border-radius: 4px; padding: 4px 6px; width: 70px; font: inherit;
    }
    label { font-size: 13px; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .status-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: #555; margin-right: 4px; vertical-align: middle;
    }
    .status-dot.rec { background: var(--bad); animation: pulse 1.2s infinite; }
    .status-dot.busy { background: var(--warn); }
    .status-dot.ok { background: var(--good); }
    @keyframes pulse { 0%,100% {opacity:1;} 50% {opacity:.3;} }
    .meter-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 8px; }
    .meter {
      background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; font-size: 12px;
    }
    .meter .label { color: var(--muted); font-size: 11px; }
    .meter .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .meter .unit { font-size: 11px; color: var(--muted); margin-left: 3px; }
    .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 12px; }
    .checks label { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 0; cursor: pointer; }
    .checks .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
    .checks .cat { grid-column: 1 / -1; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
    .checks .cat:first-child { margin-top: 0; padding-top: 0; border-top: none; }
    #chart-wrap { position: relative; height: 360px; }
    .transcript-log {
      max-height: 220px; overflow-y: auto; font-size: 13px; line-height: 1.6;
      background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    }
    .transcript-log .turn { padding: 4px 0; border-bottom: 1px dashed #21262d; }
    .transcript-log .turn:last-child { border-bottom: none; }
    .transcript-log .ts { color: var(--muted); font-size: 11px; margin-right: 6px; font-variant-numeric: tabular-nums; }
    .transcript-log .badge {
      display: inline-block; font-size: 10px; padding: 1px 5px; margin-right: 4px;
      border-radius: 3px; background: #21262d; color: var(--muted);
    }
    .transcript-log .badge.pos { background: #1b3a1b; color: var(--good); }
    .transcript-log .badge.neg { background: #3a1b1b; color: var(--bad); }
    .toast {
      position: fixed; bottom: 16px; right: 16px; background: var(--panel);
      border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px;
      font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.5); max-width: 360px;
    }
    .small { font-size: 11px; color: var(--muted); }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #21262d; color: var(--muted); font-size: 11px; margin-left: 6px; }
  </style>
</head>
<body>

<h1>発話シグナル可視化 <span class="pill" id="model-pill">model: ModernBERT (Ruri v3)</span></h1>

<div class="panel">
  <h2>制御</h2>
  <div class="controls">
    <button id="btn-start" class="primary">録音開始</button>
    <button id="btn-stop" class="danger" disabled>停止</button>
    <button id="btn-clear">グラフ消去</button>
    <span><span class="status-dot" id="rec-dot"></span><span id="rec-text">待機中</span></span>
    <span class="small">送信間隔
      <input type="number" id="interval" min="3" max="60" step="1" value="10" />秒
    </span>
    <span class="small">直近送信: <span id="last-sent">--</span></span>
    <span class="small">分析ステータス: <span id="analyze-status">--</span></span>
  </div>
</div>

<div class="panel">
  <h2>表示する指標</h2>
  <div class="checks" id="checks"></div>
</div>

<div class="panel">
  <h2>リアルタイム値</h2>
  <div class="meter-row" id="meters"></div>
</div>

<div class="panel">
  <h2>時系列</h2>
  <div id="chart-wrap"><canvas id="chart"></canvas></div>
</div>

<div class="panel">
  <h2>文字起こし</h2>
  <div class="transcript-log" id="transcript-log"></div>
</div>

<script>
/* ============================================================
 * 発話シグナル可視化アプリ
 * 14指標: 8 言語/対話 (ModernBERT 分類) + 6 韻律/タイミング (クライアント計算)
 *
 * パイプライン:
 *  - getUserMedia → AudioContext → AudioWorklet で raw samples を保持
 *  - 200ms ごとに realtime metrics (F0/RMS/onset/pause/confidence_prosody) 計算
 *  - INTERVAL_SEC 毎にバッファ WAV を POST /api/fujii/exp/analyze
 *    → サーバが whisper-1 で文字起こし + ModernBERT (Ruri v3, ModernBERT-Ja 2024) で 8 シグナル zero-shot 分類
 * ============================================================ */

const METRIC_DEFS = [
  // 言語/対話シグナル（ModernBERT zero-shot 分類, present→1 / absent→0、value は cosine 類似度）
  { id: 'lang-agree',      cat: '言語',     name: '同意表現',           dir: 'pos', source: 'bert', color: '#3fb950' },
  { id: 'lang-disagree',   cat: '言語',     name: '不同意・反論',       dir: 'neg', source: 'bert', color: '#f85149' },
  { id: 'lang-understand', cat: '言語',     name: '理解・確認応答',     dir: 'pos', source: 'bert', color: '#56d364' },
  { id: 'lang-repair',     cat: '言語',     name: '聞き返し・修復',     dir: 'neg', source: 'bert', color: '#ff8c42' },
  { id: 'lang-hedge',      cat: '言語',     name: '不確実性 (hedge)',   dir: 'neg', source: 'bert', color: '#d29922' },
  { id: 'lang-stance',     cat: '言語',     name: '意見変化',           dir: 'pos', source: 'bert', color: '#a371f7' },
  { id: 'lang-commit',     cat: '言語',     name: '行動意図・コミット', dir: 'pos', source: 'bert', color: '#2ea043' },
  { id: 'dial-question',   cat: '言語',     name: '質問・根拠要求',     dir: 'neg', source: 'bert', color: '#79c0ff' },
  // 韻律/タイミング（クライアント計算）
  { id: 'pause',           cat: '韻律',     name: '応答遅延・沈黙 (s)', dir: '--',  source: 'rt',   color: '#8b949e' },
  { id: 'f0',              cat: '韻律',     name: '基本周波数 F0 (Hz)', dir: '--',  source: 'rt',   color: '#58a6ff' },
  { id: 'energy',          cat: '韻律',     name: '音量・エネルギー',   dir: '--',  source: 'rt',   color: '#ffa657' },
  { id: 'rate',            cat: '韻律',     name: '発話速度 (onset/s)', dir: '--',  source: 'rt',   color: '#f0883e' },
  { id: 'pause_max',       cat: '韻律',     name: 'ポーズ長 (s)',       dir: '--',  source: 'rt',   color: '#bc8cff' },
  { id: 'conf_prosody',    cat: '韻律',     name: '確信度プロソディ',   dir: 'pos', source: 'mix',  color: '#39d353' },
];

const DEFAULT_ON = new Set(['lang-agree','lang-disagree','lang-understand','lang-hedge','dial-question','f0','energy','conf_prosody']);

// ========== UI 構築 ==========
const checksEl = document.getElementById('checks');
const metersEl = document.getElementById('meters');
const visible = new Set();
const checkboxes = {};
let lastByCat = '';
for (const m of METRIC_DEFS) {
  if (m.cat !== lastByCat) {
    const head = document.createElement('div');
    head.className = 'cat';
    head.textContent = m.cat === '言語' ? '言語/対話シグナル (ModernBERT 分類)' : '韻律・タイミング (リアルタイム)';
    checksEl.appendChild(head);
    lastByCat = m.cat;
  }
  const lab = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = DEFAULT_ON.has(m.id);
  cb.addEventListener('change', () => { toggle(m.id, cb.checked); });
  const sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = m.color;
  lab.append(cb, sw, document.createTextNode(' ' + m.name));
  checksEl.appendChild(lab);
  checkboxes[m.id] = cb;
  if (DEFAULT_ON.has(m.id)) visible.add(m.id);

  const mt = document.createElement('div'); mt.className = 'meter';
  mt.innerHTML = `<div class="label">${m.name}</div><div class="value" id="meter-${m.id}">--</div>`;
  metersEl.appendChild(mt);
}

// ========== Chart.js ==========
const ctx = document.getElementById('chart').getContext('2d');
const datasets = METRIC_DEFS.map(m => ({
  label: m.name,
  data: [],
  borderColor: m.color,
  backgroundColor: m.color + '22',
  borderWidth: m.source === 'bert' ? 2 : 1.5,
  pointRadius: m.source === 'bert' ? 3 : 0,
  tension: 0.2,
  stepped: m.source === 'bert' ? 'before' : false,
  hidden: !DEFAULT_ON.has(m.id),
  yAxisID: yAxisFor(m.id),
  _id: m.id,
}));
function yAxisFor(id) {
  if (id === 'f0') return 'yF0';
  if (id === 'energy') return 'yE';
  if (id === 'rate') return 'yR';
  if (id === 'pause' || id === 'pause_max') return 'yP';
  return 'y01'; // 0..1 シグナル & confidence
}
const chart = new Chart(ctx, {
  type: 'line',
  data: { datasets },
  options: {
    animation: false,
    responsive: true, maintainAspectRatio: false,
    parsing: false,
    scales: {
      x: { type: 'linear', title: { display: true, text: '経過秒', color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
      y01:  { position: 'left',  min: 0, max: 1.05, title: { display: true, text: '0..1 (シグナル/確信度)', color: '#8b949e' }, ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
      yF0:  { position: 'right', min: 70, max: 400, title: { display: true, text: 'F0 (Hz)', color: '#58a6ff' }, ticks: { color: '#58a6ff' }, grid: { display: false }, display: 'auto' },
      yE:   { position: 'right', min: 0, max: 0.3, title: { display: true, text: 'RMS', color: '#ffa657' }, ticks: { color: '#ffa657' }, grid: { display: false }, display: 'auto' },
      yR:   { position: 'right', min: 0, max: 10, title: { display: true, text: 'onset/s', color: '#f0883e' }, ticks: { color: '#f0883e' }, grid: { display: false }, display: 'auto' },
      yP:   { position: 'right', min: 0, max: 5, title: { display: true, text: 'pause (s)', color: '#bc8cff' }, ticks: { color: '#bc8cff' }, grid: { display: false }, display: 'auto' },
    },
    plugins: { legend: { labels: { color: '#e6edf3', font: { size: 11 } } } }
  }
});

function toggle(id, on) {
  if (on) visible.add(id); else visible.delete(id);
  const ds = datasets.find(d => d._id === id);
  if (ds) ds.hidden = !on;
  chart.update('none');
}
document.getElementById('btn-clear').addEventListener('click', () => {
  for (const d of datasets) d.data.length = 0;
  document.getElementById('transcript-log').innerHTML = '';
  chart.update('none');
});

// ========== Audio capture (AudioWorklet) ==========
const TARGET_SR = 16000;
let audioCtx = null, mediaStream = null, sourceNode = null, workletNode = null;
let captureSampleRate = 48000; // cached so flush works after close
let pcmBuffer = []; // Float32 chunks at audioCtx.sampleRate
let sessionStartMs = 0;
let lastSpeechEndMs = 0;
let lastSpeechFrameMs = 0;
let recording = false;
let intervalTimer = null;
let rtTimer = null;
let analysisInflight = 0;

const recDot = document.getElementById('rec-dot');
const recText = document.getElementById('rec-text');
const analyzeStatus = document.getElementById('analyze-status');

// AudioWorklet をインラインで定義 (Blob URL 経由で addModule)
const WORKLET_SRC = `
class CaptureProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const input = inputs[0];
    if (input && input[0]) {
      // copy because the underlying buffer is reused
      this.port.postMessage(input[0].slice(0));
    }
    return true;
  }
}
registerProcessor('capture-processor', CaptureProcessor);
`;
const workletUrl = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));

async function startRecording() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    alert('マイク取得に失敗: ' + e.message);
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  captureSampleRate = audioCtx.sampleRate;
  try {
    await audioCtx.audioWorklet.addModule(workletUrl);
  } catch (e) {
    console.error('[exp] AudioWorklet addModule failed', e);
    alert('AudioWorklet を読み込めませんでした。HTTPS でアクセスしてください。\n' + e.message);
    return;
  }
  sourceNode = audioCtx.createMediaStreamSource(mediaStream);
  workletNode = new AudioWorkletNode(audioCtx, 'capture-processor', { numberOfInputs: 1, numberOfOutputs: 0 });
  workletNode.port.onmessage = (ev) => {
    if (recording) pcmBuffer.push(ev.data);
  };
  sourceNode.connect(workletNode);

  recording = true;
  sessionStartMs = performance.now();
  lastSpeechEndMs = sessionStartMs;
  lastSpeechFrameMs = sessionStartMs;
  pcmBuffer = [];
  rtFrames = [];
  utterPause = 0; utterMaxPause = 0;
  chunkStartIdx = 0;

  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  recDot.className = 'status-dot rec';
  recText.textContent = '録音中...';

  rtTimer = setInterval(realtimeTick, 200);
  scheduleNextChunkUpload();
}

function stopRecording() {
  recording = false;
  if (rtTimer) { clearInterval(rtTimer); rtTimer = null; }
  if (intervalTimer) { clearTimeout(intervalTimer); intervalTimer = null; }
  try { workletNode && workletNode.disconnect(); } catch {}
  try { sourceNode && sourceNode.disconnect(); } catch {}
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  mediaStream = null; sourceNode = null; workletNode = null; audioCtx = null;

  // 最後のチャンクを送信
  flushChunkForAnalysis();

  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  recDot.className = 'status-dot';
  recText.textContent = '停止';
}

document.getElementById('btn-start').addEventListener('click', startRecording);
document.getElementById('btn-stop').addEventListener('click', stopRecording);

// ========== リアルタイム韻律計算 ==========
const RT_HOP_MS = 200;
const RT_F0_FFT = 2048;
const VAD_RMS = 0.012;
let rtFrames = [];        // {t, f0, rms, voiced}
let utterPause = 0, utterMaxPause = 0;

function realtimeTick() {
  if (!recording || !audioCtx) return;
  const sr = captureSampleRate;
  // 直近 ~RT_F0_FFT サンプルを抽出
  let need = RT_F0_FFT;
  const tailBuf = new Float32Array(RT_F0_FFT);
  let pos = RT_F0_FFT;
  for (let i = pcmBuffer.length - 1; i >= 0 && pos > 0; i--) {
    const buf = pcmBuffer[i];
    const take = Math.min(pos, buf.length);
    tailBuf.set(buf.subarray(buf.length - take), pos - take);
    pos -= take;
  }
  if (pos > 0) return; // not enough samples yet

  let sum = 0;
  for (let i = 0; i < tailBuf.length; i++) sum += tailBuf[i] * tailBuf[i];
  const rms = Math.sqrt(sum / tailBuf.length);
  const voiced = rms > VAD_RMS;
  let f0 = null;
  if (voiced) f0 = estimateF0Autocorr(tailBuf, sr);

  const now = performance.now();
  const tSec = (now - sessionStartMs) / 1000;

  if (voiced) {
    if (utterPause > utterMaxPause) utterMaxPause = utterPause;
    utterPause = 0;
    lastSpeechFrameMs = now;
    lastSpeechEndMs = now;
  } else {
    utterPause = (now - lastSpeechFrameMs) / 1000;
  }
  const pauseFromLastSpeech = (now - lastSpeechEndMs) / 1000;

  rtFrames.push({ t: tSec, f0, rms, voiced });
  if (rtFrames.length > 1200) rtFrames.shift(); // ~4min max

  // メーター更新
  setMeter('f0', f0 == null ? null : f0, 'Hz', 0);
  setMeter('energy', rms, '', 4);
  setMeter('pause', pauseFromLastSpeech, 's', 2);
  setMeter('pause_max', utterMaxPause, 's', 2);
  // onset rate: rms の立ち上がり数 (直近 3 秒)
  const rate = computeOnsetRate(rtFrames, 3.0);
  setMeter('rate', rate, '/s', 2);

  // チャートにリアルタイム系を追加
  pushPoint('f0', tSec, f0);
  pushPoint('energy', tSec, rms);
  pushPoint('rate', tSec, rate);
  pushPoint('pause', tSec, pauseFromLastSpeech);
  pushPoint('pause_max', tSec, utterMaxPause);
  // 大量更新を抑えるため間引いて再描画
  if (rtFrames.length % 5 === 0) chart.update('none');
}

function estimateF0Autocorr(buf, sr) {
  // 70-400Hz を探索
  const minLag = Math.floor(sr / 400);
  const maxLag = Math.floor(sr / 70);
  let bestLag = -1, bestCorr = 0;
  let energy = 0;
  for (let i = 0; i < buf.length; i++) energy += buf[i] * buf[i];
  if (energy < 1e-4) return null;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let c = 0;
    for (let i = 0; i + lag < buf.length; i++) c += buf[i] * buf[i + lag];
    if (c > bestCorr) { bestCorr = c; bestLag = lag; }
  }
  if (bestLag < 0 || bestCorr / energy < 0.3) return null;
  return sr / bestLag;
}

function computeOnsetRate(frames, windowSec) {
  if (frames.length < 4) return 0;
  const tEnd = frames[frames.length - 1].t;
  const t0 = tEnd - windowSec;
  let prev = 0, onsets = 0;
  for (const f of frames) {
    if (f.t < t0) { prev = f.rms; continue; }
    if (f.rms > prev * 1.4 && f.rms > VAD_RMS) onsets++;
    prev = f.rms;
  }
  return onsets / windowSec;
}

function setMeter(id, val, unit, digits) {
  const el = document.getElementById('meter-' + id);
  if (!el) return;
  if (val == null || isNaN(val)) el.innerHTML = '--';
  else el.innerHTML = (typeof digits === 'number' ? val.toFixed(digits) : val) + (unit ? `<span class="unit">${unit}</span>` : '');
}

function pushPoint(id, t, v) {
  if (v == null || isNaN(v)) return;
  const ds = datasets.find(d => d._id === id);
  if (!ds) return;
  ds.data.push({ x: t, y: v });
  // x の古い点を捨てる (5分上限)
  while (ds.data.length > 0 && t - ds.data[0].x > 300) ds.data.shift();
}

// ========== 一定間隔の ModernBERT 分析 ==========
function scheduleNextChunkUpload() {
  if (!recording) return;
  const sec = Math.max(3, Math.min(60, parseInt(document.getElementById('interval').value, 10) || 10));
  intervalTimer = setTimeout(async () => {
    await flushChunkForAnalysis();
    scheduleNextChunkUpload();
  }, sec * 1000);
}

let chunkStartIdx = 0;
async function flushChunkForAnalysis() {
  const sr = captureSampleRate;
  if (!sr) return;
  // pcmBuffer 全部を結合 (前回送信以降の分だけ)
  const samplesArr = pcmBuffer.slice(chunkStartIdx);
  chunkStartIdx = pcmBuffer.length;
  if (samplesArr.length === 0) return;
  let total = 0;
  for (const a of samplesArr) total += a.length;
  if (total < sr * 0.8) return; // 0.8秒未満は捨てる

  const merged = new Float32Array(total);
  let off = 0;
  for (const a of samplesArr) { merged.set(a, off); off += a.length; }

  // 16kHz にダウンサンプリング
  const ds = downsample(merged, sr, TARGET_SR);
  const wav = encodeWAV(ds, TARGET_SR);
  const tEndSec = (performance.now() - sessionStartMs) / 1000;

  analysisInflight++;
  document.getElementById('last-sent').textContent = `t=${tEndSec.toFixed(1)}s (${Math.round(wav.byteLength/1024)}KB)`;
  setAnalyzeStatus('解析中...', 'busy');

  try {
    const fd = new FormData();
    fd.append('audio', new Blob([wav], { type: 'audio/wav' }), 'chunk.wav');
    fd.append('role', 'speaker');
    const base = getBasePath();
    const resp = await fetch(`${base}/api/fujii/exp/analyze`, { method: 'POST', body: fd });
    const data = await resp.json();
    if (!resp.ok) {
      console.error('[exp] analyze error', resp.status, data);
      setAnalyzeStatus(`エラー ${resp.status}`, 'bad');
      return;
    }
    handleAnalysisResult(tEndSec, data);
    setAnalyzeStatus('OK', 'ok');
  } catch (e) {
    console.error('[exp] analyze failed', e);
    setAnalyzeStatus('通信失敗', 'bad');
  } finally {
    analysisInflight--;
  }
}

function handleAnalysisResult(tEndSec, data) {
  // 8 シグナルを 0/1 (or confidence) でプロット
  const sigs = data.signals || {};
  for (const m of METRIC_DEFS) {
    if (m.source !== 'bert') continue;
    const info = sigs[m.id];
    const present = info && info.present;
    const conf = info && typeof info.confidence === 'number' ? info.confidence : (present ? 1 : 0);
    const v = present ? conf : 0;
    pushPoint(m.id, tEndSec, v);
    setMeter(m.id, v, '', 2);
  }
  // confidence_prosody
  if (typeof data.confidence_prosody === 'number') {
    pushPoint('conf_prosody', tEndSec, data.confidence_prosody);
    setMeter('conf_prosody', data.confidence_prosody, '', 2);
  }
  // transcript ログ
  appendTranscript(tEndSec, data);
  chart.update('none');
}

function appendTranscript(tSec, data) {
  const log = document.getElementById('transcript-log');
  const turn = document.createElement('div'); turn.className = 'turn';
  const ts = document.createElement('span'); ts.className = 'ts';
  ts.textContent = `[${tSec.toFixed(1)}s]`;
  turn.appendChild(ts);
  const sigs = data.signals || {};
  for (const m of METRIC_DEFS) {
    if (m.source !== 'bert') continue;
    const info = sigs[m.id]; if (!info || !info.present) continue;
    const b = document.createElement('span');
    b.className = 'badge ' + (m.dir === 'pos' ? 'pos' : m.dir === 'neg' ? 'neg' : '');
    b.textContent = m.name;
    b.title = info.evidence || '';
    turn.appendChild(b);
  }
  const txt = document.createElement('span');
  txt.textContent = data.transcript || '(無音)';
  turn.appendChild(txt);
  if (data.overall_summary) {
    const s = document.createElement('div');
    s.className = 'small'; s.style.paddingLeft = '6px';
    s.textContent = '🧠 ' + data.overall_summary + (data.prosody_interpretation ? ' / 🎵 ' + data.prosody_interpretation : '');
    turn.appendChild(s);
  }
  log.appendChild(turn);
  log.scrollTop = log.scrollHeight;
}

function setAnalyzeStatus(text, kind) {
  analyzeStatus.textContent = text;
  analyzeStatus.style.color = kind === 'ok' ? '#3fb950' : kind === 'busy' ? '#d29922' : kind === 'bad' ? '#f85149' : '#8b949e';
}

// ========== WAV エンコード ==========
function downsample(buffer, srcRate, dstRate) {
  if (dstRate === srcRate) return buffer;
  const ratio = srcRate / dstRate;
  const outLen = Math.floor(buffer.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const s = Math.floor(i * ratio);
    const e = Math.floor((i + 1) * ratio);
    let sum = 0, count = 0;
    for (let j = s; j < e && j < buffer.length; j++) { sum += buffer[j]; count++; }
    out[i] = count > 0 ? sum / count : 0;
  }
  return out;
}

function encodeWAV(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeString = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    off += 2;
  }
  return buffer;
}

function getBasePath() {
  // /webxr/fujii/exp.html の様に proxy 配下なら /webxr が prefix になる
  const m = location.pathname.match(/^(\/webxr)?\//);
  return m && m[1] ? m[1] : '';
}
